<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No color-scheme meta: a static value contradicts the theme below the
         moment it is not dark. src/index.css drives it from --color-scheme. -->
    <title>DKIP — Defense Knowledge Intelligence Platform</title>
    <script>
      // Stamp the theme before first paint, so there is no flash of the wrong
      // one. A stored choice wins; with none, follow the OS. Default is dark.
      (function () {
        var t = localStorage.getItem("dkip_theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
